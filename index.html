<!DOCTYPE HTML>
<html lang='en'>
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width,intial-scale=1.0">
        <title>Student Registration Form</title>
        <link rel="stylesheet" href="style.css">
    </head>
    <body>
        <div class="container">
        <h1>Student Registration Form</h1>
        <p class="description">Please fill in your details below.</p>
        <form id="studentform">
            <div class="form-group">
                <label for="studentname">Student Name</label>
                <input type="text" id="studentname" name="studentname" placeholder="Enter you full name" required>
            </div>
            <div class="form-group">
                <label for="email">Email address</label>
                <input type="email" id="email" name="email" placeholder="example@gmail.com" required>
            </div>
            <div class="form-goup">
                <label for="phone">Phone Number</label>
                <input type="tel" id="phone" name="phone" placeholder="Enter your phone number" required>
            </div>
            <div class="form-group">
                <label for="college">College Name</label>
                <input type="text" id="collegename" name="collegename" placeholder="Enter your college name" required>
            </div>
            <div class="form-group">
                <label for="department">Department</label>
                <select id="department" name="department" required>
                    <option value="">Select Department</option>
                    <option value="cse">Computer Science and Engineering</option>
                    <option value="ece">Electronics and Communication Engineering</option>
                    <option value="eee">Electronics and Electrical Engineering</option>
                    <option value="mech">Mechanical Engineering</option>
                    <option value="civil">Civil Engineering</option>
                </select>
            </div>
            <div class="form-group">
                <label for="year">Year of Study</label>
                <select id="year" name="year" required>
                    <option value="">select Year</option>
                    <option value="1">First Year</option>
                    <option vaue="2">Second Year</option>
                    <option value="3">Third Year</option>
                    <option value="4">Fourth year</option>
                </select>
            </div>
            <div class="form-group">
                <label>Gender</label>
                <div class="radio-group">
                    <label>
                        <input type="radio" name="gender" value="male" required>Male
                    </label>
                    <label>
                        <input type="radio" name="gender" value="female" required>Female
                    </label>
                    <label>
                        <input type="radio" name="gender" value="other" required>Other
                    </label>
                </div>
            </div>
            <div class="form-group">
                <label for="dob">Date of Birth</label>
                <input type="date" id="dob" name="dob" required>
            </div>
            <div class="form-group">
                <label for="address">Address</label>
                <textarea id="address" name="address" placeholder="Enter your complete address" required></textarea>
            </div>
            <div class="form-group">
                <label for="city">City</label>
                <input type="text" id="city" name="city" placeholder="Enter your city" required>
            </div>
            <div class="form-group">
                <label for="state">State</label>
                <input type="text" id="state" name="state" placeholder="Enter your state" required>
            </div>
            <div class="form-group">
                <label for="pincode">Pincode</label>
                <input type="text" id="pincode" name="pincode" placeholder="Enter your pincode" required>
            </div>
            <div class="form-group">
                <label for="password">Password</label>
                <input type="password" id="password" name="password" placeholder="create a password" required>
            </div>
            <div class="form-group">
                <label for="confirmpassword">Confirm Password</label>
                <input type="password" id="conirmpassword" name="confirmpassword" placeholder="Re-enter your password" required>
            </div>
            <div class="terms">
                <label>
                    <input type="checkbox" id="terms" required>
                    I agree to the terms and conditions.
                </label>
            </div>
            <button type="submit">
                Submit Form
            </button>
        </form>
        </div>
        <script src="script.js"></script>
    </body>
